<!-- Text-only card (no screenshot): big claim + sub + sticker. -->
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width: 1080px; height: 1920px; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .wrap { position: relative; z-index: 5; padding: 0 80px; }
  h1 { font-size: 150px; } h2 { font-size: 42px; margin-top: 44px; } .sticker { font-size: 44px; margin-top: 90px; }
  .b1 { width: 520px; height: 520px; left: -180px; top: 200px; }
  .b2 { width: 440px; height: 440px; right: -140px; bottom: 260px; }
  .b3 { width: 300px; height: 300px; right: 120px; top: 240px; }
  .s1 { width: 340px; height: 340px; left: 60px; bottom: 180px; }
</style>
<div class="halftone"></div>
<div class="blob c3 b1"></div><div class="blob c2 b2"></div><div class="blob c1 b3"></div><div class="burst c4 s1"></div>
<div class="wrap"><h1 id="title"></h1><h2 id="sub"></h2><br><span class="sticker" id="chip"></span></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML = (q.get('title') || '').replace(/\|/g, '<br>');
  document.getElementById('sub').textContent = q.get('sub') || '';
  document.getElementById('chip').textContent = q.get('chip') || '';
</script>
