  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16140f; --panel: rgba(30,27,20,0.9); --ink: #e8e2d4;
      --ink-soft: #9a9182; --line: #37321f; --accent: #f0a742;
      --c-core: #f0a742; --c-deferred: #d4c04a; --c-mcp: #5bb8d4;
      --c-agents: #b39ddb; --c-skills: #7fc98a;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f3ee; --panel: rgba(255,255,255,0.9); --ink: #26221a;
    --ink-soft: #6b6456; --line: #d8d3c6; --accent: #b45a00;
    --c-core: #b45a00; --c-deferred: #8a6d00; --c-mcp: #1f6f8b;
    --c-agents: #6d4fa0; --c-skills: #3d7a45;
  }
  :root[data-theme="dark"] {
    --bg: #16140f; --panel: rgba(30,27,20,0.9); --ink: #e8e2d4;
    --ink-soft: #9a9182; --line: #37321f; --accent: #f0a742;
    --c-core: #f0a742; --c-deferred: #d4c04a; --c-mcp: #5bb8d4;
    --c-agents: #b39ddb; --c-skills: #7fc98a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); overflow: hidden;
  }
  #graph { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #graph.dragging { cursor: grabbing; }

  .hud {
    position: fixed; top: 1rem; left: 1rem; z-index: 2;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.8rem 1rem; max-width: 300px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .hud p.eyebrow {
    font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 0.25rem;
  }
  .hud h1 { font-size: 1.05rem; margin: 0 0 0.45rem; letter-spacing: -0.01em; }
  .hud input {
    width: 100%; font-family: var(--mono); font-size: 0.75rem;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 0.35rem 0.55rem; outline: none; margin-bottom: 0.45rem;
  }
  .hud input:focus { border-color: var(--accent); }
  .hud p.hint { font-size: 0.68rem; color: var(--ink-soft); margin: 0; line-height: 1.5; }
  .scopes { display: flex; gap: 0.25rem; margin-bottom: 0.45rem; flex-wrap: wrap; }
  .scopes button {
    font-family: var(--mono); font-size: 0.62rem; cursor: pointer;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 4px; padding: 0.2rem 0.5rem;
  }
  .scopes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .scopes button[aria-pressed="true"] {
    color: var(--accent); border-color: var(--accent); font-weight: 600;
  }

  .legend {
    position: fixed; bottom: 1rem; left: 1rem; z-index: 2;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.6rem 0.9rem; display: flex; flex-direction: column; gap: 0.3rem;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .legend div { display: flex; align-items: center; gap: 0.5rem; font-family: var(--mono); font-size: 0.66rem; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #tooltip {
    position: fixed; z-index: 3; pointer-events: none; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.4rem 0.65rem; font-family: var(--mono); font-size: 0.7rem;
    max-width: 260px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #tooltip b { color: var(--accent); }
  #tooltip span { color: var(--ink-soft); display: block; margin-top: 2px; font-size: 0.62rem; }
</style>

          ['ponytail-debt','track deliberate shortcuts'], ['ponytail-help','reference card'],
          ['ponytail-review','YAGNI code review'],
        ])},
        { label: 'other plugins', sub: 'commit-cmds, feature-dev…', collapsed: true, scope: 'plugin', kids: P([
          ['clean_gone','delete gone branches'], ['commit','conventional commit'],
          ['commit-push-pr','commit, push, PR'], ['feature-dev','guided feature development'],
          ['revise-claude-md','update CLAUDE.md'], ['claude-md-improver','audit CLAUDE.md'],
          ['claude-automation-recommender','suggest hooks / automation'],
          ['karpathy-guidelines','karpathy coding guidelines'],
          ['skill-creator:skill-creator','build & eval skills'],
        ])},
      ]},
    ]
  };
  // DATA:END

  // ---- build graph ---------------------------------------------------
  const nodes = [], links = [];
  let idc = 0;
  function build(spec, parent, depth, angle) {
    const kids = spec.kids || [];
    const count = spec.count || (kids.length ? kids.reduce((s, k) => s + (k.count || (k.kids ? k.kids.length : 1)), 0) : 1);
    const r = depth === 0 ? 26 : depth === 1 ? 17 : kids.length ? 8 + Math.sqrt(count) * 1.1 : 4.5 + Math.sqrt(spec.count || 1) * 1.8;
    const n = {
      id: idc++, label: spec.label, sub: spec.sub, r, depth, count,
      colorVar: spec.colorVar || (parent && parent.colorVar), parent,
      scope: spec.scope || (parent && parent.scope),
      collapsed: !!spec.collapsed, children: [], nbrs: [],
      x: 0, y: 0, vx: 0, vy: 0, hidden: false, scopeIn: true,
    };
    if (parent) {
      const dist = depth === 1 ? 260 : depth === 2 ? 130 + r * 3 : 60;
      n.x = parent.x + Math.cos(angle) * dist;
      n.y = parent.y + Math.sin(angle) * dist;
      links.push({ a: parent, b: n, rest: dist });
      parent.children.push(n);
      parent.nbrs.push(n); n.nbrs.push(parent);
    }
    nodes.push(n);
    kids.forEach((k, i) => {
      const spread = depth === 0 ? Math.PI * 2 : depth === 1 ? 1.9 : 2.6;
      const base = depth === 0 ? -Math.PI / 2 : angle;
      const a = base + (kids.length > 1 ? (i / (kids.length - (depth === 0 ? 0 : 1)) - (depth === 0 ? 0 : 0.5)) * spread : 0);
      build(k, n, depth + 1, a);
    });
    return n;
  }
  const hub = build(TREE, null, 0, 0);

  let currentScope = 'all';
  // node passes if it or any descendant matches the scope filter
  function applyScope(n) {
    const self = currentScope === 'all' || n.scope === currentScope;
    let any = self;
    n.children.forEach(c => { if (applyScope(c)) any = true; });
    n.scopeIn = any || n === hub;
    return any;
  }
  function recomputeHidden(n, hiddenByAncestor) {
    if (n !== hub) n.hidden = hiddenByAncestor || !n.scopeIn;
    n.children.forEach(c => recomputeHidden(c, hiddenByAncestor || n.collapsed || !n.scopeIn));
  }
  recomputeHidden(hub, false);

  document.getElementById('scopes').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    currentScope = btn.dataset.scope;
    for (const b of btn.parentElement.children) b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    applyScope(hub);
    recomputeHidden(hub, false);
    alpha = Math.max(alpha, 0.4);
    draw();
  });

  // ---- simulation ----------------------------------------------------
  let alpha = 1, dragNode = null;
  function tick() {
    const active = nodes.filter(n => !n.hidden);
    // ponytail: O(n²) repulsion, fine under ~400 visible nodes
    for (let i = 0; i < active.length; i++) {
      for (let j = i + 1; j < active.length; j++) {
        const a = active[i], b = active[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { d2 = 1; dx = Math.random() - 0.5; dy = Math.random() - 0.5; }
        if (d2 > 90000) continue;
        const d = Math.sqrt(d2);
        const f = Math.min(900 * (a.r + b.r) / d2, 8) * alpha;
        const fx = dx / d * f, fy = dy / d * f;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    for (const l of links) {
      if (l.a.hidden || l.b.hidden) continue;
      const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - l.rest) * 0.02 * alpha;
      const fx = dx / d * f, fy = dy / d * f;
      l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy;
    }
    for (const n of active) {
      n.vx -= n.x * 0.0012 * alpha; n.vy -= n.y * 0.0012 * alpha;
      if (n === dragNode) { n.vx = 0; n.vy = 0; continue; }
      n.vx *= 0.85; n.vy *= 0.85;
      n.x += n.vx; n.y += n.vy;
    }
    alpha *= 0.995;
  }
  if (reducedMotion) { for (let i = 0; i < 400; i++) tick(); alpha = 0; }

  // ---- view / render -------------------------------------------------
  const view = { x: 0, y: 0, k: 1 };
  let W = 0, H = 0, dpr = 1, hoverNode = null, searchSet = null;

  function highlightSet() {
    if (searchSet) return searchSet;
    if (hoverNode) { const s = new Set([hoverNode]); hoverNode.nbrs.forEach(n => s.add(n)); return s; }
    return null;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css('--bg');
    ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2 + view.x, H / 2 + view.y);
    ctx.scale(view.k, view.k);

    const ink = css('--ink'), inkSoft = css('--ink-soft'), line = css('--line'), accent = css('--accent');
    const hs = highlightSet();

    ctx.lineWidth = 1 / view.k;
    for (const l of links) {
      if (l.a.hidden || l.b.hidden) continue;
      ctx.globalAlpha = hs ? (hs.has(l.a) && hs.has(l.b) ? 0.9 : 0.08) : 1;
      ctx.strokeStyle = line;
      ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    }

    for (const n of nodes) {
      if (n.hidden) continue;
      const inSet = !hs || hs.has(n);
      ctx.globalAlpha = inSet ? (n.depth >= 2 ? 0.8 : 1) : 0.12;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = n === hub ? accent : css(n.colorVar);
      ctx.fill();
      if (n === hoverNode || (n.collapsed && n.children.length)) {
        ctx.strokeStyle = ink; ctx.lineWidth = 2 / view.k; ctx.stroke();
      }
      const showLabel = n.depth <= 1 || view.k >= 1.15 || n === hoverNode || (hs && hs.has(n));
      if (showLabel) {
        const fs = n.depth === 0 ? 13 : n.depth === 1 ? 11 : n.children.length ? 10 : 8.5;
        ctx.font = `${n.depth <= 1 || n.children.length ? 600 : 400} ${fs / Math.max(view.k, 1)}px ${css('--mono')}`;
        ctx.fillStyle = n.depth >= 2 && !n.children.length ? inkSoft : ink;
        ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x, n.y + n.r + 11 / Math.max(view.k, 1));
      }
      if (n.collapsed && n.children.length) {
        ctx.font = `600 ${Math.max(7, Math.min(n.r * 0.9, 10)) / Math.max(view.k, 1)}px ${css('--mono')}`;
        ctx.fillStyle = css('--bg');
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+' + n.children.length, n.x, n.y);
        ctx.textBaseline = 'alphabetic';
      }
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    draw();
  }
  addEventListener('resize', resize);

  function loop() {
    if (alpha > 0.02) { tick(); draw(); }
    requestAnimationFrame(loop);
  }

  // ---- search ---------------------------------------------------------
  searchBox.addEventListener('input', () => {
    const q = searchBox.value.trim().toLowerCase();
    if (q.length < 2) { searchSet = null; draw(); return; }
    const s = new Set();
    for (const n of nodes) {
      if (n.label.toLowerCase().includes(q)) {
        s.add(n);
        // reveal + include ancestors
        let p = n.parent;
        while (p) { s.add(p); if (p.collapsed) p.collapsed = false; p = p.parent; }
      }
    }
    recomputeHidden(hub, false);
    searchSet = s.size ? s : null;
    alpha = Math.max(alpha, 0.3);
    draw();
  });

  // ---- interaction ---------------------------------------------------
  function toWorld(px, py) {
    return { x: (px - W / 2 - view.x) / view.k, y: (py - H / 2 - view.y) / view.k };
  }
  function pick(px, py) {
    const p = toWorld(px, py);
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (n.hidden) continue;
      const dx = p.x - n.x, dy = p.y - n.y;
      const hit = n.r + 4;
      if (dx * dx + dy * dy <= hit * hit) return n;
    }
    return null;
  }
  function zoomAt(px, py, k2) {
    k2 = Math.min(Math.max(k2, 0.2), 5);
    const wx = (px - W / 2 - view.x) / view.k;
    const wy = (py - H / 2 - view.y) / view.k;
    view.x = px - W / 2 - wx * k2;
    view.y = py - H / 2 - wy * k2;
    view.k = k2;
  }

  const pointers = new Map();
  let panning = false, moved = 0, last = { x: 0, y: 0 }, pinch = null;

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(b.x - a.x, b.y - a.y), k: view.k };
      dragNode = null; panning = false;
      return;
    }
    canvas.classList.add('dragging');
    moved = 0; last = { x: e.clientX, y: e.clientY };
    dragNode = pick(e.clientX, e.clientY);
    panning = !dragNode;
  });

  canvas.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.k * d / pinch.d);
      draw();
      return;
    }
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (dragNode || panning) {
      moved += Math.abs(dx) + Math.abs(dy);
      if (dragNode) {
        dragNode.x += dx / view.k; dragNode.y += dy / view.k;
        alpha = Math.max(alpha, 0.3);
      } else {
        view.x += dx; view.y += dy;
      }
      last = { x: e.clientX, y: e.clientY };
      draw();
    } else {
      const n = pick(e.clientX, e.clientY);
      if (n !== hoverNode) { hoverNode = n; draw(); }
      if (n) {
        tooltip.style.display = 'block';
        tooltip.style.left = Math.min(e.clientX + 14, W - 280) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
        const extra = n.children.length ? '<span>' + n.children.length + ' items · click to ' + (n.collapsed ? 'expand' : 'collapse') + '</span>' : '';
        let desc = n.sub || (n.parent ? 'in: ' + (n.parent.parent && n.parent.parent.parent ? n.parent.parent.label + ' / ' : '') + n.parent.label : '');
        if (n.scope) desc += ' · scope: ' + n.scope;
        tooltip.innerHTML = '<b>' + n.label + '</b>' + (desc ? '<span>' + desc + '</span>' : '') + extra;
      } else {
        tooltip.style.display = 'none';
      }
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    canvas.classList.remove('dragging');
    if (moved < 5 && !pinch) {
      const n = pick(e.clientX, e.clientY);
      if (n && n.children.length && n !== hub) {
        n.collapsed = !n.collapsed;
        recomputeHidden(hub, false);
        alpha = Math.max(alpha, 0.4);
        draw();
      }
    }
    dragNode = null; panning = false;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('dblclick', e => {
    if (pick(e.clientX, e.clientY)) return;
    view.x = 0; view.y = 0; view.k = 1;
    draw();
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, view.k * Math.exp(-e.deltaY * 0.0012));
    draw();
  }, { passive: false });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  resize();
  loop();
})();
</script>
